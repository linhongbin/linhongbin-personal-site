# Site-wide settings for hongbinlin.com (Jekyll).
# Values here are read in the templates as {{ site.title }}, {{ site.email }}, and so on.
# Jekyll does *not* reload this file on `bundle exec jekyll serve`; restart the server after editing.

title: Hongbin Lin
name: Hongbin Lin
position: Robotics Manipulation Engineer
email: hongbinlin@link.cuhk.edu.hk
description: >-
  I am a robotics manipulation engineer at a Chinese embodied-AI startup, and I hold a
  Ph.D. from the Chinese University of Hong Kong, supervised by Prof. Kwok Wai Samuel Au.
  My work is on force control and embodied VLA models for contact-rich manipulation, and
  on robot learning that survives contact with real hardware.


baseurl: "" # the subpath of your site, e.g. /blog
url: "https://hongbinlin.com" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: hongbinlin_ben
github_username: linhongbin
google_scholar: 9K1iBJwAAAAJ

# No analytics provider is configured. Leaving the key unset makes
# `site.google_analytics` nil, so an `{% if site.google_analytics %}` guard around the
# gtag snippet will correctly skip it. Do not put a real measurement ID here until the
# provider is decided.
# google_analytics:

# Build settings
theme: minima
plugins:
  - jekyll-feed

sass:
  style: compact

# Exclude from processing.
# Anything listed here is added to Jekyll's internal default list and is never copied
# into the built site. `context/` and CLAUDE.md are working files, not site content --
# without these entries Jekyll publishes them at hongbinlin.com/CLAUDE.md and
# hongbinlin.com/context/status.html. Do not remove them.
exclude:
  - context/
  - CLAUDE.md
  - RUNBOOK.md           # GitHub 可读的运维说明，不渲染成站点页面
  - .claude/
  - README.md            # 仓库说明，不是站点页面
  - cv.html              # 孤儿页（站上无链接指向），内容过期待重做；暂不对外
  - images/blog/README.md # 目录说明，否则会渲染成 /images/blog/ 这个页面
  - Gemfile
  - Gemfile.lock
  - vendor/
